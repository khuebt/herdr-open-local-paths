name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test path resolution
        run: python3 test-open-path.py
      - name: Check Python syntax
        run: python3 -m py_compile open-path.py test-open-path.py
