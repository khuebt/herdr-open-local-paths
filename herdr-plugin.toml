id = "khuebt.open-local-paths"
name = "Open Local Paths"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Open clicked local files and folders with Ubuntu's default applications"
platforms = ["linux"]

[[actions]]
id = "open-path"
title = "Open local path"
contexts = ["global"]
command = ["python3", "open-path.py"]

[[link_handlers]]
id = "local-path"
title = "Open local file or folder"
pattern = "^(file://.*|[A-Za-z0-9_~./ -]+(:[0-9]+){0,2})$"
action = "open-path"
